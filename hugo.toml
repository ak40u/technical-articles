baseURL = "https://pvolkov.com/"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[params]
  author = "Pavel Volkov"
  authorLatin = "Павел Волков"
  authorUrl = "https://github.com/ak40u"
  github = "https://github.com/ak40u"
  linkedin = "https://www.linkedin.com/in/psvolkov/"
  copyright = "© 2026 Pavel Volkov"

[languages]
  [languages.ru]
    label = "Русский"
    locale = "ru"
    contentDir = "content/ru"
    weight = 1
    title = "Технические статьи"
    [languages.ru.params]
      tagline = "Практические разборы инженерных систем, автономной разработки, QA, релизов и инфраструктуры."
      authorLatin = "Павел Волков"
      authorRole = "ИИ-архитектор и инженер"
      bio = "Практические разборы и опыт построения автономных инженерных систем: архитектура агентов, воспроизводимые спецификации (Agentic SDD), QA-контуры и релизные процессы."
      bioTags = ["ИИ-инженерия", "автономные команды", "QA и аудит", "релизы", "инженерный процесс"]
      dateFormat = "02.01.2006"
      ogLocale = "ru_RU"
      defaultImage = "og/ai-tech-teams-workflow-hero.png"
  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 2
    title = "Technical Articles"
    [languages.en.params]
      tagline = "Practical explorations of engineering systems, autonomous development, QA, releases, and infrastructure."
      authorRole = "AI architect and engineer"
      bio = "Practical breakdowns and field notes on autonomous engineering systems: multi-agent architecture, verifiable specifications (Agentic SDD), QA loops, and release pipelines."
      bioTags = ["AI engineering", "autonomous teams", "QA and audits", "releases", "engineering process"]
      dateFormat = "January 2, 2006"
      ogLocale = "en_US"
      defaultImage = "og/ai-tech-teams-workflow-hero-en.png"

[outputs]
  home = ["HTML", "RSS", "LLMS"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[taxonomies]
  tag = "tags"
