<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 440">
    <!-- Background -->
    <rect width="1140" height="440" fill="#f8fafc" rx="8"/>
    
    <!-- Definitions -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,1 L9,5 L0,9" fill="none" stroke="#64748b" stroke-width="2"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,1 L9,5 L0,9" fill="none" stroke="#ef4444" stroke-width="2"/>
        </marker>
        <style>
            .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 6px; }
            .agent-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2px; rx: 6px; }
            .artifact-box { fill: #f0fdf4; stroke: #86efac; stroke-width: 2px; rx: 6px; }
            .gate-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2px; rx: 6px; }
            
            .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 13px; fill: #0f172a; text-anchor: middle; }
            .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
            .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #334155; text-anchor: middle; }
            .loop-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #ef4444; text-anchor: middle; }
            .ok-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #16a34a; text-anchor: middle; }
        </style>
    </defs>

    <!-- Header Labels -->
    <text class="badge" x="140" y="35">1. Isolation &amp; Recon</text>
    <text class="badge" x="425" y="35">2. Independent Contracts</text>
    <text class="badge" x="710" y="35">3. Spec Synthesis</text>
    <text class="badge" x="995" y="35">4. Adversarial Review</text>

    <!-- Column 1: Input & Scout -->
    <rect class="box" x="30" y="60" width="220" height="60"/>
    <text class="title" x="140" y="85">ClickUp Task</text>
    <text class="subtitle" x="140" y="103">Description + Comment Thread</text>

    <line x1="140" y1="120" x2="140" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="agent-box" x="30" y="150" width="220" height="70"/>
    <text class="title" x="140" y="175">Pre-plan Scout</text>
    <text class="subtitle" x="140" y="193">Read-only Repo Scan</text>
    <text class="subtitle" x="140" y="208">(files, imports, types)</text>

    <line x1="140" y1="220" x2="140" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="artifact-box" x="30" y="250" width="220" height="60"/>
    <text class="title" x="140" y="275">Worktree &amp; Slices</text>
    <text class="subtitle" x="140" y="295">plans/&lt;slug&gt;-slices.md</text>

    <!-- Connections to Column 2 -->
    <path d="M 250 185 C 285 185, 285 110, 315 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250 185 C 285 185, 285 260, 315 260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Column 2: Independent Analysts -->
    <!-- Olga -->
    <rect class="agent-box" x="315" y="60" width="220" height="55"/>
    <text class="title" x="425" y="83">Agent Olga (BA)</text>
    <text class="subtitle" x="425" y="100">Anti-anchoring Analysis</text>

    <line x1="425" y1="115" x2="425" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="artifact-box" x="315" y="135" width="220" height="55"/>
    <text class="title" x="425" y="157">acceptance-criteria.md</text>
    <text class="subtitle" x="425" y="175">Positive AC + Must-Not Rules</text>

    <!-- Eva -->
    <rect class="agent-box" x="315" y="225" width="220" height="55"/>
    <text class="title" x="425" y="248">Agent Eva (UX)</text>
    <text class="subtitle" x="425" y="265">Design System Contract</text>

    <line x1="425" y1="280" x2="425" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="artifact-box" x="315" y="300" width="220" height="55"/>
    <text class="title" x="425" y="322">UX Contract</text>
    <text class="subtitle" x="425" y="340">Loading / Empty / Error / A11y</text>

    <!-- Connections to Column 3 (Tech-Lead) -->
    <path d="M 535 162 C 565 162, 565 185, 600 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 535 327 C 565 327, 565 220, 600 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Column 3: Tech-Lead Synthesis -->
    <rect class="agent-box" x="600" y="150" width="220" height="100"/>
    <text class="title" x="710" y="175">Tech-Lead Agent</text>
    <text class="subtitle" x="710" y="195">• State Machine Transitions</text>
    <text class="subtitle" x="710" y="212">• Foundations &amp; Debt Registry</text>
    <text class="subtitle" x="710" y="230">• Blind Jury Selection</text>

    <line x1="710" y1="250" x2="710" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="artifact-box" x="600" y="280" width="220" height="60"/>
    <text class="title" x="710" y="303">plan.md &amp; phase-*.md</text>
    <text class="subtitle" x="710" y="323">+ decisions.md (No code!)</text>

    <!-- Connection to Column 4 (Review) -->
    <path d="M 820 310 C 850 310, 850 200, 885 200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Column 4: Adversarial Review Loop -->
    <rect class="gate-box" x="885" y="150" width="220" height="90"/>
    <text class="title" x="995" y="175">Adversarial Review</text>
    <text class="subtitle" x="995" y="195">Codex / Hunyuan 3 / Opus</text>
    <text class="subtitle" x="995" y="212">Hunts phantom method calls</text>
    <text class="subtitle" x="995" y="228">Checks DB migrations</text>

    <!-- Rejection Loop back to Tech-Lead -->
    <path d="M 995 150 C 995 85, 710 85, 710 140" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
    <text class="loop-label" x="850" y="75">Findings caught (Fix plan)</text>

    <!-- Exit to Execution -->
    <line x1="995" y1="240" x2="995" y2="280" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="ok-label" x="995" y="265">NO ISSUES</text>

    <rect class="artifact-box" x="885" y="280" width="220" height="60" stroke="#16a34a" stroke-width="2"/>
    <text class="title" x="995" y="305" fill="#15803d">Approved Spec</text>
    <text class="subtitle" x="995" y="323">Ready for code cooking</text>

</svg>
