<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350">
    <!-- Background -->
    <rect width="1000" height="350" fill="#f8fafc" rx="8"/>
    
    <!-- Definitions -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,1 L9,5 L0,9" fill="none" stroke="#64748b" stroke-width="2"/>
        </marker>
        <style>
            .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 6px; }
            .agent { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2px; rx: 6px; }
            .artifact { fill: #f0fdf4; stroke: #86efac; stroke-width: 2px; rx: 6px; }
            .gate { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2px; rx: 6px; }
            
            .text-title { font-family: -apple-system, system-ui, sans-serif; font-weight: bold; font-size: 14px; fill: #1e293b; text-anchor: middle; }
            .text-sub { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
            .label { font-family: -apple-system, system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #475569; text-anchor: middle; }
        </style>
    </defs>

    <!-- Phase 0: Producer -->
    <rect class="agent" x="40" y="120" width="160" height="60"/>
    <text class="text-title" x="120" y="145">Producer Agent</text>
    <text class="text-sub" x="120" y="165">Scans backlog &amp; logs</text>

    <!-- Value Task -->
    <rect class="artifact" x="40" y="210" width="160" height="40"/>
    <text class="text-title" x="120" y="235">Top-5 Priority Tasks</text>

    <line x1="120" y1="180" x2="120" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 200 230 C 230 230, 230 150, 260 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 1: Autopilot / Scout -->
    <rect class="agent" x="270" y="120" width="160" height="60"/>
    <text class="text-title" x="350" y="145">Autopilot: Scout</text>
    <text class="text-sub" x="350" y="165">Maps the territory</text>

    <!-- Artifact: Scout Log & AC -->
    <rect class="artifact" x="270" y="210" width="160" height="40"/>
    <text class="text-title" x="350" y="228">scout-map.log &amp;</text>
    <text class="text-title" x="350" y="244">acceptance-criteria.md</text>

    <line x1="350" y1="180" x2="350" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    
    <path d="M 430 230 C 460 230, 460 150, 490 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 2: Codex Review -->
    <rect class="gate" x="500" y="120" width="160" height="60"/>
    <text class="text-title" x="580" y="145">Adversarial Review</text>
    <text class="text-sub" x="580" y="165">Codex attacks plan</text>

    <line x1="660" y1="150" x2="710" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 3: Code & Tests -->
    <rect class="agent" x="720" y="120" width="160" height="60"/>
    <text class="text-title" x="800" y="145">Implementation</text>
    <text class="text-sub" x="800" y="165">failing-tests then code</text>

    <line x1="800" y1="180" x2="800" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 4: QA -->
    <rect class="gate" x="720" y="210" width="160" height="60"/>
    <text class="text-title" x="800" y="235">Marina QA Loop</text>
    <text class="text-sub" x="800" y="255">5 rounds fix-retest</text>
    
    <path d="M 880 240 C 940 240, 940 150, 880 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
    <text class="label" x="930" y="195">Rejects</text>

    <text class="label" x="120" y="90">Stage 0: Finding Value</text>
    <text class="label" x="350" y="90">Stage 1: Mapping</text>
    <text class="label" x="580" y="90">Stage 2: Validation</text>
    <text class="label" x="800" y="90">Stage 3-4: Build &amp; QA</text>

</svg>
