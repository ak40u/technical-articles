<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Testing a business idea for 45 thousand dollars instead of 1.6 million</title>
  <desc id="desc">Article cover showing an estimate of 120 to 190 person-months of conventional development</desc>
  <rect width="1920" height="1080" fill="#0b0f14"/>
  <path d="M0 820 C390 690 650 960 1020 805 C1330 675 1570 705 1920 520 L1920 1080 L0 1080 Z" fill="#101923"/>
  <circle cx="1555" cy="216" r="250" fill="#172431"/>
  <circle cx="1555" cy="216" r="170" fill="#0b0f14" stroke="#42d392" stroke-width="3" opacity="0.9"/>
  <path d="M1465 216 H1645 M1555 126 V306" stroke="#42d392" stroke-width="3" opacity="0.35"/>
  <text x="150" y="190" fill="#42d392" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="5">5 MONTHS · $45,000</text>
  <text x="142" y="482" fill="#f4f7fa" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="800" letter-spacing="-10">≈ $1.6m</text>
  <text x="150" y="625" fill="#c8d2dc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="600">conventional cost</text>
  <text x="150" y="715" fill="#c8d2dc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="600">of the same result</text>
  <line x1="150" y1="830" x2="1770" y2="830" stroke="#344454" stroke-width="2"/>
  <text x="150" y="916" fill="#8293a3" font-family="Arial, Helvetica, sans-serif" font-size="34">120–190 person-months · 14–20 months</text>
  <text x="150" y="976" fill="#8293a3" font-family="Arial, Helvetica, sans-serif" font-size="30">Estimated from code, architecture and E2E — without Git history</text>
</svg>
