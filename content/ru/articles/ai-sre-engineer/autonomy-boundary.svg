<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
  <title id="title">Граница автономии по обратимости</title>
  <desc id="desc">Слева то, что агенты делают сами: расследуют, отвечают клиентам и операторам, пишут хотфиксы, вливают проверенные изменения и сдерживают инцидент обратимыми мерами. Справа то, что требует моего согласия: релизы, запись в продакшен-базу, деньги и любые необратимые шаги.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a776f"/>
    </marker>
    <marker id="arrow-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f4f2f"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7b5d"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a34a3f"/>
    </marker>
    <style>
      .bg { fill: #fcfbf7; }
      .owner { fill: #f7eadc; stroke: #8f4f2f; stroke-width: 3; }
      .core { fill: #e8f2f4; stroke: #245f73; stroke-width: 3; }
      .chip { fill: #ffffff; stroke: #245f73; stroke-width: 2; }
      .chip-quiet { fill: #f3f0e8; stroke: #8b867d; stroke-width: 2; }
      .project { fill: #edf6ef; stroke: #4f7b5d; stroke-width: 2.5; }
      .task { fill: #f3f0e8; stroke: #8b867d; stroke-width: 2; }
      .code { fill: #f3f0e8; stroke: #2b2a27; stroke-width: 3; }
      .warn { fill: #fae9e5; stroke: #a34a3f; stroke-width: 2.5; }
      .dark { fill: #2b2a27; }
      .line { fill: none; stroke: #7a776f; stroke-width: 3; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #7a776f; stroke-width: 3; }
      .okline { fill: none; stroke: #4f7b5d; stroke-width: 3; marker-end: url(#arrow-ok); }
      .warnline { fill: none; stroke: #a34a3f; stroke-width: 3; marker-end: url(#arrow-warn); }
      .ownerline { fill: none; stroke: #8f4f2f; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-owner); }
      .blocked { fill: none; stroke: #a34a3f; stroke-width: 3; stroke-dasharray: 8 8; }
      .cross { fill: #fcfbf7; stroke: #a34a3f; stroke-width: 3; }
      .cross-x { stroke: #a34a3f; stroke-width: 4; stroke-linecap: round; }
      .divider { stroke: #8b867d; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .rule { stroke: #ded9cd; stroke-width: 1.5; }
      .title { fill: #1d1d1b; font: 800 40px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #6c6860; font: 400 23px Arial, Helvetica, sans-serif; }
      .label { fill: #1d1d1b; font: 700 26px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .label-l { fill: #1d1d1b; font: 700 24px Arial, Helvetica, sans-serif; }
      .chip-t { fill: #1d1d1b; font: 700 22px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small { fill: #5f5b54; font: 400 21px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small-l { fill: #5f5b54; font: 400 20px Arial, Helvetica, sans-serif; }
      .edge { fill: #5f5b54; font: 700 19px Arial, Helvetica, sans-serif; }
      .edge-m { fill: #5f5b54; font: 700 19px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .edge-owner { fill: #8f4f2f; font: 700 19px Arial, Helvetica, sans-serif; }
      .edge-warn { fill: #a34a3f; font: 700 19px Arial, Helvetica, sans-serif; }
      .on-dark { fill: #fcfbf7; font: 700 22px Arial, Helvetica, sans-serif; }
      .on-dark-2 { fill: #d9d4c7; font: 400 20px Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="910"/>
  <text class="title" x="60" y="68">Граница автономии по обратимости</text>
  <text class="subtitle" x="60" y="106">Обратимое агенты делают сами, необратимое ждёт меня</text>
  <rect class="project" x="60" y="140" width="500" height="540" rx="16"/>
  <text class="label" x="310" y="186">Агенты сами</text>
  <text class="small" x="310" y="218">шаг можно отменить</text>
  <line class="rule" x1="84" y1="242" x2="536" y2="242"/>
  <text class="label-l" x="90" y="286">Расследование</text>
  <text class="small-l" x="90" y="316">читают код и базу</text>
  <text class="label-l" x="90" y="381">Ответы</text>
  <text class="small-l" x="90" y="411">клиентам и операторам</text>
  <text class="label-l" x="90" y="476">Хотфиксы</text>
  <text class="small-l" x="90" y="506">и вливание проверенных изменений</text>
  <text class="label-l" x="90" y="571">Сдерживание инцидента</text>
  <text class="small-l" x="90" y="601">переключить маршрут,</text>
  <text class="small-l" x="90" y="628">откатить сборку,</text>
  <text class="small-l" x="90" y="655">отсеять ложную тревогу</text>
  <rect class="owner" x="640" y="140" width="500" height="540" rx="16"/>
  <text class="label" x="890" y="186">Только с моего согласия</text>
  <text class="small" x="890" y="218">шаг меняет прод насовсем</text>
  <line class="rule" x1="664" y1="242" x2="1116" y2="242"/>
  <text class="label-l" x="670" y="286">Релизы</text>
  <text class="small-l" x="670" y="316">выкатка в прод</text>
  <text class="label-l" x="670" y="381">Запись в прод-базу</text>
  <text class="small-l" x="670" y="411">любая</text>
  <text class="label-l" x="670" y="476">Деньги</text>
  <text class="small-l" x="670" y="506">любые траты</text>
  <text class="label-l" x="670" y="571">Всё необратимое</text>
  <text class="small-l" x="670" y="601">что нельзя быстро отменить</text>
  <line class="divider" x1="600" y1="150" x2="600" y2="670"/>
  <rect class="dark" x="60" y="720" width="1080" height="150" rx="16"/>
  <text class="on-dark" x="90" y="762">Цена паузы и цена ошибки</text>
  <text class="on-dark-2" x="90" y="798">Слева ожидание человека стоит минут простоя, а ошибка отменяется.</text>
  <text class="on-dark-2" x="90" y="828">Справа ошибка стоит дороже короткого подтверждения.</text>
</svg>
