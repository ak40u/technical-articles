<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Куда идёт вопрос команды</title>
  <desc id="desc">Вопрос техлида уходит в одну из трёх колонок. Команда сама решает лишний раунд ревью, занятый стенд, спор об интерфейсе и спорную сумму. Руководитель решает споры команд, долгие прогоны, ревью по кругу и очередь. Меня спрашивают о проде, продукте, цифрах клиента и новых тратах. Ночной вопрос ждёт утра.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a776f"/>
    </marker>
    <marker id="arrow-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f4f2f"/>
    </marker>
    <style>
      .bg { fill: #fcfbf7; }
      .owner { fill: #f7eadc; stroke: #8f4f2f; stroke-width: 3; }
      .core { fill: #e8f2f4; stroke: #245f73; stroke-width: 3; }
      .project { fill: #edf6ef; stroke: #4f7b5d; stroke-width: 2.5; }
      .task { fill: #f3f0e8; stroke: #8b867d; stroke-width: 2; }
      .warn { fill: #fae9e5; stroke: #a34a3f; stroke-width: 2; }
      .dark { fill: #2b2a27; }
      .line { fill: none; stroke: #7a776f; stroke-width: 2.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #7a776f; stroke-width: 2.5; }
      .ownerline { fill: none; stroke: #8f4f2f; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-owner); }
      .rule { stroke: #ded9cd; stroke-width: 1.5; }
      .title { fill: #1d1d1b; font: 800 38px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #6c6860; font: 400 21px Arial, Helvetica, sans-serif; }
      .label { fill: #1d1d1b; font: 700 21px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .label-l { fill: #1d1d1b; font: 700 19px Arial, Helvetica, sans-serif; }
      .small { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small-l { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; }
      .edge { fill: #5f5b54; font: 700 16px Arial, Helvetica, sans-serif; }
      .edge-owner { fill: #8f4f2f; font: 700 16px Arial, Helvetica, sans-serif; }
      .band { fill: #1d1d1b; font: 400 18px Arial, Helvetica, sans-serif; }
      .band-b { fill: #1d1d1b; font: 700 18px Arial, Helvetica, sans-serif; }
      .on-dark { fill: #fcfbf7; font: 700 21px Arial, Helvetica, sans-serif; }
      .on-dark-2 { fill: #d9d4c7; font: 400 18px Arial, Helvetica, sans-serif; }
      .mono { fill: #1d1d1b; font: 400 15px Menlo, Consolas, monospace; }
      .footer { fill: #245f73; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="60" y="62">Куда идёт вопрос команды</text>
  <text class="subtitle" x="60" y="98">Правила собраны из моих прошлых ответов</text>
  <rect class="task" x="560" y="130" width="480" height="90" rx="14"/>
  <text class="label" x="800.0" y="166">Вопрос у техлида</text>
  <text class="small" x="800.0" y="196">роли команды наружу не пишут</text>
  <line class="plain" x1="800" y1="220" x2="800" y2="245"/>
  <line class="plain" x1="290" y1="245" x2="1310" y2="245"/>
  <line class="line" x1="290" y1="245" x2="290" y2="276"/>
  <line class="line" x1="800" y1="245" x2="800" y2="276"/>
  <line class="line" x1="1310" y1="245" x2="1310" y2="276"/>
  <rect class="project" x="60" y="280" width="460" height="440" rx="16"/>
  <text class="label" x="290" y="322">Решает команда</text>
  <text class="small" x="290" y="350">и пишет решение в журнал</text>
  <line class="rule" x1="84" y1="372" x2="496" y2="372"/>
  <text class="label-l" x="88" y="412">Ещё раунд ревью</text>
  <text class="small-l" x="88" y="440">я одобрил 21 раз из 21</text>
  <text class="label-l" x="88" y="492">Стенд занят</text>
  <text class="small-l" x="88" y="520">«жди»: так я ответил в 6 случаях из 7</text>
  <text class="label-l" x="88" y="572">Спор об интерфейсе</text>
  <text class="small-l" x="88" y="600">решает UX-ревьюер</text>
  <text class="label-l" x="88" y="652">Спорная сумма</text>
  <text class="small-l" x="88" y="680">пометить, не менять</text>
  <rect class="core" x="570" y="280" width="460" height="440" rx="16"/>
  <text class="label" x="800" y="322">Решает руководитель</text>
  <text class="small" x="800" y="350">так, как решил бы я</text>
  <line class="rule" x1="594" y1="372" x2="1006" y2="372"/>
  <text class="label-l" x="598" y="412">Чей стенд или PR</text>
  <text class="small-l" x="598" y="440">спор между командами</text>
  <text class="label-l" x="598" y="492">Прогон дольше двух часов</text>
  <text class="small-l" x="598" y="520">только машинное время</text>
  <text class="label-l" x="598" y="572">Ревью по кругу</text>
  <text class="small-l" x="598" y="600">ещё раунд или закрыть остаток</text>
  <text class="label-l" x="598" y="652">Очередь</text>
  <text class="small-l" x="598" y="680">порядок и перезапуск упавших</text>
  <rect class="owner" x="1080" y="280" width="460" height="440" rx="16"/>
  <text class="label" x="1310" y="322">Спрашивают меня</text>
  <text class="small" x="1310" y="350">в Telegram, с кнопками ответа</text>
  <line class="rule" x1="1104" y1="372" x2="1516" y2="372"/>
  <text class="label-l" x="1108" y="412">Прод и клиенты</text>
  <text class="small-l" x="1108" y="440">выкатка, письма клиентам</text>
  <text class="label-l" x="1108" y="492">Продукт и право</text>
  <text class="small-l" x="1108" y="520">8 из 10 моих правок делали продукт полнее</text>
  <text class="label-l" x="1108" y="572">Цифра у клиента</text>
  <text class="small-l" x="1108" y="600">которую он уже видел</text>
  <text class="label-l" x="1108" y="652">Новые траты</text>
  <text class="small-l" x="1108" y="680">и мои «спроси перед»</text>
  <rect class="dark" x="60" y="750" width="1480" height="110" rx="16"/>
  <text class="on-dark" x="90" y="792">Ночью я почти не отвечаю</text>
  <text class="on-dark-2" x="90" y="830">С 01:00 до 06:00 — два ответа за 50 дней, в девятом часу утра — 24. Ночной вопрос ждёт 08:30, команда пока делает другие задачи.</text>
</svg>
