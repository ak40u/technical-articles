<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Отопление, стоимость которого компенсирует ETC</title>
  <desc id="desc">Сравниваем не доход майнера, а чистую стоимость полезного тепла.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54717c"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="heat" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <style>
      .bg { fill: #0b121d; }
      .grid { stroke: #173044; stroke-width: 1; opacity: .32; }
      .title { fill: #f8fafc; font: 800 42px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #94a3b8; font: 400 21px Arial, Helvetica, sans-serif; }
      .kicker { fill: #67e8f9; font: 700 16px Arial, Helvetica, sans-serif; letter-spacing: 1.8px; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .small { fill: #a7bac6; font: 400 17px Arial, Helvetica, sans-serif; }
      .micro { fill: #7f99a8; font: 600 14px Arial, Helvetica, sans-serif; letter-spacing: .5px; }
      .mono { fill: #d9edf5; font: 700 18px Menlo, Monaco, Consolas, monospace; }
      .line { fill: none; stroke: #54717c; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8b5cf6; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <g><path class="grid" d="M0 0V900"/><path class="grid" d="M80 0V900"/><path class="grid" d="M160 0V900"/><path class="grid" d="M240 0V900"/><path class="grid" d="M320 0V900"/><path class="grid" d="M400 0V900"/><path class="grid" d="M480 0V900"/><path class="grid" d="M560 0V900"/><path class="grid" d="M640 0V900"/><path class="grid" d="M720 0V900"/><path class="grid" d="M800 0V900"/><path class="grid" d="M880 0V900"/><path class="grid" d="M960 0V900"/><path class="grid" d="M1040 0V900"/><path class="grid" d="M1120 0V900"/><path class="grid" d="M1200 0V900"/><path class="grid" d="M1280 0V900"/><path class="grid" d="M1360 0V900"/><path class="grid" d="M1440 0V900"/><path class="grid" d="M1520 0V900"/><path class="grid" d="M1600 0V900"/><path class="grid" d="M0 0H1600"/><path class="grid" d="M0 80H1600"/><path class="grid" d="M0 160H1600"/><path class="grid" d="M0 240H1600"/><path class="grid" d="M0 320H1600"/><path class="grid" d="M0 400H1600"/><path class="grid" d="M0 480H1600"/><path class="grid" d="M0 560H1600"/><path class="grid" d="M0 640H1600"/><path class="grid" d="M0 720H1600"/><path class="grid" d="M0 800H1600"/><path class="grid" d="M0 880H1600"/></g>
  <text class="title" x="56" y="66">Отопление, стоимость которого компенсирует ETC</text>
  <text class="subtitle" x="56" y="104">Сравниваем не доход майнера, а чистую стоимость полезного тепла.</text>

  <rect x="56" y="142" width="350" height="156" rx="18" fill="#181d24" stroke="#64748b" stroke-width="2"/>
  <text class="kicker" x="82" y="180" fill="#cbd5e1">ОБЫЧНЫЙ ОБОГРЕВАТЕЛЬ</text>
  <text class="label" x="82" y="226">0,63 кВт электричества</text>
  <text x="82" y="266" fill="#fb923c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">→ 0,63 кВт тепла</text>

  <rect x="430" y="142" width="350" height="156" rx="18" fill="#102b2b" stroke="#22c55e" stroke-width="2"/>
  <text class="kicker" x="456" y="180" fill="#86efac">JASMINER X16-Q</text>
  <text class="label" x="456" y="226">0,63 кВт электричества</text>
  <text x="456" y="266" fill="#34d399" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">→ 0,63 кВт тепла + ETC</text>

  <path class="line" d="M792 220H838"/>
  <rect x="850" y="142" width="694" height="156" rx="18" fill="#11233a" stroke="#38bdf8" stroke-width="3"/>
  <text class="kicker" x="884" y="180">ПОЛЕЗНАЯ ФОРМУЛА</text>
  <text x="884" y="226" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">СЧЕТ ЗА СВЕТ − КОМПЕНСАЦИЯ ETC</text>
  <text x="884" y="267" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">= ЧИСТАЯ СТОИМОСТЬ ТЕПЛА</text>

  <text class="micro" x="70" y="330">Снимок для 3 асиков · 28,5 дня · 1,85 GH/s каждый</text>
  <rect x="70" y="350" width="336" height="104" rx="14" fill="#111f2c" stroke="#2c4658"/><text x="94" y="393" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">1 292,8 кВт·ч</text><text class="micro" x="94" y="428">ПОЛЕЗНОЕ ТЕПЛО</text><rect x="436" y="350" width="336" height="104" rx="14" fill="#111f2c" stroke="#2c4658"/><text x="460" y="393" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">5 443 ₽</text><text class="micro" x="460" y="428">СЧЕТ ЗА СВЕТ</text><rect x="802" y="350" width="336" height="104" rx="14" fill="#111f2c" stroke="#2c4658"/><text x="826" y="393" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">7 057 ₽</text><text class="micro" x="826" y="428">КОМПЕНСАЦИЯ ETC</text><rect x="1168" y="350" width="336" height="104" rx="14" fill="#111f2c" stroke="#2c4658"/><text x="1192" y="393" fill="#34d399" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">−1 615 ₽</text><text class="micro" x="1192" y="428">СТОИМОСТЬ ТЕПЛА</text>

  <rect x="56" y="490" width="1488" height="326" rx="22" fill="#101b27" stroke="#355066" stroke-width="2"/>
  <text class="label" x="88" y="536">Мягкая цель энергобюджета</text>
  <text class="small" x="88" y="570">Штрафа за недобор нет. Комфорт важнее использования дешевой квоты.</text>

  <rect x="116" y="636" width="1318" height="36" rx="18" fill="#1e293b"/>
  <rect x="116" y="636" width="988" height="36" rx="18" fill="#0f766e"/>
  <rect x="1104" y="636" width="67" height="36" fill="#ca8a04"/>
  <rect x="1171" y="636" width="263" height="36" rx="18" fill="#9f2d35"/>

  <line x1="1044" y1="614" x2="1044" y2="696" stroke="#34d399" stroke-width="4"/>
  <circle cx="1044" cy="654" r="9" fill="#34d399" filter="url(#glow)"/>
  <text x="1024" y="606" text-anchor="end" fill="#86efac" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">3 асика · 1 407 кВт·ч</text>

  <line x1="1104" y1="626" x2="1104" y2="682" stroke="#fde047" stroke-width="3"/>
  <text x="1104" y="722" text-anchor="middle" fill="#fde047" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">цель · 1 500</text>

  <line x1="1171" y1="614" x2="1171" y2="696" stroke="#fb923c" stroke-width="4"/>
  <text x="1191" y="606" text-anchor="start" fill="#fdba74" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">граница тарифа · 1 600</text>

  <line x1="1352" y1="626" x2="1352" y2="682" stroke="#fb7185" stroke-width="4"/>
  <text x="1352" y="722" text-anchor="middle" fill="#fda4af" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">4 асика · 1 876</text>

  <text class="micro" x="116" y="766" fill="#5eead4">ОПТИМАЛЬНЫЙ ТЕМП</text>
  <text class="micro" x="1240" y="766" fill="#fda4af">РИСК ДИАПАЗОНА 2</text>
  <rect x="56" y="838" width="1488" height="42" rx="12" fill="#18202b" stroke="#334155"/>
  <text class="small" x="80" y="865">Сейчас Pacing прогнозирует темп по активным слотам × 630 Вт. Для точного остатка нужен общий счетчик дома.</text>
</svg>