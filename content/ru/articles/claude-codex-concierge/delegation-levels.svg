<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Два уровня делегирования</title>
  <desc id="desc">Слева человек вручную управляет множеством задач. Справа Консьерж управляет проектными сессиями, а человек сохраняет цели, приоритеты и границы риска.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a776f"/>
    </marker>
    <style>
      .bg { fill: #fcfbf7; }
      .lane { fill: #fff; stroke: #ded9cd; stroke-width: 2; }
      .lane2 { fill: #f7fbfc; stroke: #245f73; stroke-width: 3; }
      .box { fill: #fff; stroke: #8b867d; stroke-width: 2; }
      .owner { fill: #f7eadc; stroke: #8f4f2f; stroke-width: 3; }
      .core { fill: #e8f2f4; stroke: #245f73; stroke-width: 3; }
      .project { fill: #edf6ef; stroke: #4f7b5d; stroke-width: 2.5; }
      .task { fill: #f3f0e8; stroke: #8b867d; stroke-width: 2; }
      .warn { fill: #fae9e5; stroke: #a34a3f; stroke-width: 2; }
      .ok { fill: #edf6ef; stroke: #4f7b5d; stroke-width: 2; }
      .line { fill: none; stroke: #7a776f; stroke-width: 2.5; marker-end: url(#arrow); }
      .title { fill: #1d1d1b; font: 800 38px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #6c6860; font: 400 21px Arial, Helvetica, sans-serif; }
      .lane-title { fill: #245f73; font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 1.8px; }
      .label { fill: #1d1d1b; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .note { fill: #1d1d1b; font: 700 17px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .note2 { fill: #5f5b54; font: 400 15px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .footer { fill: #245f73; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="60" y="62">Когда делегировать задачи уже недостаточно</text>
  <text class="subtitle" x="60" y="98">При сотнях задач узким местом становится управление: очередь, контекст, контроль и следующий шаг.</text>

  <rect class="lane" x="60" y="142" width="700" height="628" rx="16"/>
  <text class="lane-title" x="92" y="184">УРОВЕНЬ 1 · ДЕЛЕГИРОВАТЬ ЗАДАЧИ</text>

  <rect class="owner" x="260" y="216" width="300" height="108" rx="12"/>
  <text class="label" x="410" y="258">ЧЕЛОВЕК</text>
  <text class="small" x="410" y="290">сам раздаёт каждую задачу</text>

  <rect class="task" x="100" y="414" width="250" height="104" rx="12"/>
  <text class="label" x="225" y="454">АГЕНТ · ЗАДАЧА 1</text>
  <text class="small" x="225" y="485">отдельный контекст</text>

  <rect class="task" x="470" y="414" width="250" height="104" rx="12"/>
  <text class="label" x="595" y="454">АГЕНТ · ЗАДАЧА 2</text>
  <text class="small" x="595" y="485">отдельный статус</text>

  <rect class="task" x="100" y="552" width="250" height="104" rx="12"/>
  <text class="label" x="225" y="592">АГЕНТ · ЗАДАЧА 3</text>
  <text class="small" x="225" y="623">отдельный результат</text>

  <rect class="task" x="470" y="552" width="250" height="104" rx="12"/>
  <text class="label" x="595" y="592">АГЕНТ · ЗАДАЧА N</text>
  <text class="small" x="595" y="623">ещё одно ожидание</text>

  <path class="line" d="M 410 324 L 410 366 L 225 366 L 225 402"/>
  <path class="line" d="M 410 366 L 595 366 L 595 402"/>
  <path class="line" d="M 410 366 L 410 532 L 225 532 L 225 540"/>
  <path class="line" d="M 410 532 L 595 532 L 595 540"/>

  <rect class="warn" x="100" y="686" width="620" height="60" rx="10"/>
  <text class="note" x="410" y="712">ЧЕЛОВЕК ДЕРЖИТ ВСЁ В ГОЛОВЕ</text>
  <text class="note2" x="410" y="735">очередь · контекст · статусы · блокировки · следующий шаг</text>

  <rect class="lane2" x="840" y="142" width="700" height="628" rx="16"/>
  <text class="lane-title" x="872" y="184">УРОВЕНЬ 2 · ДЕЛЕГИРОВАТЬ УПРАВЛЕНИЕ</text>

  <rect class="owner" x="1040" y="216" width="300" height="108" rx="12"/>
  <text class="label" x="1190" y="258">ЧЕЛОВЕК</text>
  <text class="small" x="1190" y="290">цели · приоритеты · границы</text>

  <rect class="core" x="1040" y="378" width="300" height="120" rx="12"/>
  <text class="label" x="1190" y="421">КОНСЬЕРЖ</text>
  <text class="small" x="1190" y="453">маршрут · память · контроль</text>
  <text class="small" x="1190" y="478">сводки · расписание</text>

  <rect class="project" x="880" y="560" width="190" height="96" rx="12"/>
  <text class="label" x="975" y="598">ПРОЕКТ A</text>
  <text class="small" x="975" y="628">свои сессии</text>

  <rect class="project" x="1095" y="560" width="190" height="96" rx="12"/>
  <text class="label" x="1190" y="598">ПРОЕКТ B</text>
  <text class="small" x="1190" y="628">свои сессии</text>

  <rect class="project" x="1310" y="560" width="190" height="96" rx="12"/>
  <text class="label" x="1405" y="598">ПРОЕКТ N</text>
  <text class="small" x="1405" y="628">свои сессии</text>

  <path class="line" d="M 1190 324 L 1190 366"/>
  <path class="line" d="M 1190 498 L 1190 530 L 975 530 L 975 548"/>
  <path class="line" d="M 1190 530 L 1190 548"/>
  <path class="line" d="M 1190 530 L 1405 530 L 1405 548"/>

  <rect class="ok" x="880" y="686" width="620" height="60" rx="10"/>
  <text class="note" x="1190" y="712">КОНСЬЕРЖ ДЕРЖИТ ОПЕРАЦИОННЫЙ КОНТУР</text>
  <text class="note2" x="1190" y="735">разбирает входящее · продолжает сессии · приносит результат</text>

  <text class="footer" x="800" y="842">ЧЕЛОВЕК ОСТАЁТСЯ НА УРОВНЕ ПОРТФЕЛЯ: ЗАЧЕМ · КУДА · КАКОЙ РИСК ДОПУСТИМ</text>
</svg>
