<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420">
    <rect width="1140" height="420" fill="#f8fafc" rx="8"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,1 L9,5 L0,9" fill="none" stroke="#64748b" stroke-width="2"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,1 L9,5 L0,9" fill="none" stroke="#16a34a" stroke-width="2"/>
        </marker>
        <style>
            .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 6px; }
            .agent-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2px; rx: 6px; }
            .artifact-box { fill: #f0fdf4; stroke: #86efac; stroke-width: 2px; rx: 6px; }
            .gate-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2px; rx: 6px; }
            .highlight-box { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2px; rx: 6px; }
            
            .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 13px; fill: #0f172a; text-anchor: middle; }
            .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
            .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #334155; text-anchor: middle; }
            .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: bold; fill: #6366f1; text-anchor: middle; }
        </style>
    </defs>

    <!-- Header Labels -->
    <text class="badge" x="140" y="35">1. Этап 3: Запрос на ревью</text>
    <text class="badge" x="425" y="35">2. Обертка codex-exec-safe.sh</text>
    <text class="badge" x="710" y="35">3. Изоляция OpenCode + hy3</text>
    <text class="badge" x="995" y="35">4. Враждебный вердикт</text>

    <!-- Column 1: Pipeline Orchestrator -->
    <rect class="box" x="30" y="60" width="220" height="70"/>
    <text class="title" x="140" y="88">Автопилот: Этап 3</text>
    <text class="subtitle" x="140" y="106">Ревью спецификации plan.md</text>
    <text class="subtitle" x="140" y="120">до написания кода</text>

    <line x1="140" y1="130" x2="140" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="gate-box" x="30" y="175" width="220" height="70"/>
    <text class="title" x="140" y="202">Проверка квот Codex</text>
    <text class="subtitle" x="140" y="220">Исчерпан лимит GPT-5.6-sol?</text>
    <text class="tag" x="140" y="235">CODEX_ENGINE=opencode</text>

    <path d="M 250 210 C 285 210, 285 110, 315 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Column 2: Process Wrapper & Reaper -->
    <rect class="agent-box" x="315" y="60" width="220" height="100"/>
    <text class="title" x="425" y="88">codex-exec-safe.sh</text>
    <text class="subtitle" x="425" y="106">Динамический mktemp конфиг</text>
    <text class="subtitle" x="425" y="122">Перехват сигналов (trap EXIT)</text>
    <text class="tag" x="425" y="142">Zero MCP · Stdin /dev/null</text>

    <line x1="425" y1="160" x2="425" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="box" x="315" y="200" width="220" height="85"/>
    <text class="title" x="425" y="225">kill_tree() Process Reaper</text>
    <text class="subtitle" x="425" y="243">Рекурсивное снятие потомков</text>
    <text class="subtitle" x="425" y="259">Защита от утечки /dev/ptmx</text>
    <text class="subtitle" x="425" y="274">(лимит macOS: ptmx_max=511)</text>

    <!-- Column 3: OpenCode + Tencent Hunyuan 3 -->
    <path d="M 535 110 C 570 110, 570 110, 600 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="highlight-box" x="600" y="60" width="220" height="150"/>
    <text class="title" x="710" y="88">Tencent Hunyuan 3</text>
    <text class="subtitle" x="710" y="106">OpenRouter Fallback</text>
    <text class="subtitle" x="710" y="126">Контекст: 262k токенов</text>
    <text class="subtitle" x="710" y="144">Reasoning effort: high</text>
    <text class="subtitle" x="710" y="162">Время: 12-18 минут</text>
    <text class="tag" x="710" y="190">$0.13 in / $0.53 out per 1M</text>

    <line x1="710" y1="210" x2="710" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="gate-box" x="600" y="250" width="220" height="70"/>
    <text class="title" x="710" y="275">Read-Only Периметр</text>
    <text class="subtitle" x="710" y="293">read: allow · edit: deny</text>
    <text class="subtitle" x="710" y="308">bash: deny · websearch: deny</text>

    <!-- Column 4: Findings & Plan Hardening -->
    <path d="M 820 135 C 855 135, 855 110, 885 110" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect class="artifact-box" x="885" y="60" width="220" height="110"/>
    <text class="title" x="995" y="88">Отчет о дефектах плана</text>
    <text class="subtitle" x="995" y="108">9 критических находок</text>
    <text class="subtitle" x="995" y="126">Смещение 1909 vs 2000 симв.</text>
    <text class="subtitle" x="995" y="144">100% стабильность на 4 прогонах</text>

    <line x1="995" y1="170" x2="995" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="box" x="885" y="210" width="220" height="85"/>
    <text class="title" x="995" y="235">Устранение замечаний</text>
    <text class="subtitle" x="995" y="253">Коррекция plan.md и AC</text>
    <text class="subtitle" x="995" y="271">Повторный цикл до 0 ошибок</text>
    <text class="tag" x="995" y="286">Готово к фазе генерации</text>

    <!-- Feedback Loop -->
    <path d="M 885 252 C 550 390, 200 390, 140 245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
    <text class="subtitle" x="530" y="380">Итеративное ужесточение плана до полного устранения дефектов</text>
</svg>