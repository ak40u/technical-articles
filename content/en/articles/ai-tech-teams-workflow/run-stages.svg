<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How one run goes</title>
  <desc id="desc">Five groups of stages: preparation, plan, implementation, verification and wrap-up. From preflight to cleanup, with the final check at stage 10.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a776f"/>
    </marker>
    <marker id="arrow-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f4f2f"/>
    </marker>
    <style>
      .bg { fill: #fcfbf7; }
      .owner { fill: #f7eadc; stroke: #8f4f2f; stroke-width: 3; }
      .core { fill: #e8f2f4; stroke: #245f73; stroke-width: 3; }
      .project { fill: #edf6ef; stroke: #4f7b5d; stroke-width: 2.5; }
      .task { fill: #f3f0e8; stroke: #8b867d; stroke-width: 2; }
      .warn { fill: #fae9e5; stroke: #a34a3f; stroke-width: 2; }
      .dark { fill: #2b2a27; }
      .line { fill: none; stroke: #7a776f; stroke-width: 2.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #7a776f; stroke-width: 2.5; }
      .ownerline { fill: none; stroke: #8f4f2f; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-owner); }
      .rule { stroke: #ded9cd; stroke-width: 1.5; }
      .title { fill: #1d1d1b; font: 800 38px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #6c6860; font: 400 21px Arial, Helvetica, sans-serif; }
      .label { fill: #1d1d1b; font: 700 21px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .label-l { fill: #1d1d1b; font: 700 19px Arial, Helvetica, sans-serif; }
      .small { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small-l { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; }
      .edge { fill: #5f5b54; font: 700 16px Arial, Helvetica, sans-serif; }
      .edge-owner { fill: #8f4f2f; font: 700 16px Arial, Helvetica, sans-serif; }
      .band { fill: #1d1d1b; font: 400 18px Arial, Helvetica, sans-serif; }
      .band-b { fill: #1d1d1b; font: 700 18px Arial, Helvetica, sans-serif; }
      .on-dark { fill: #fcfbf7; font: 700 21px Arial, Helvetica, sans-serif; }
      .on-dark-2 { fill: #d9d4c7; font: 400 18px Arial, Helvetica, sans-serif; }
      .mono { fill: #1d1d1b; font: 400 15px Menlo, Consolas, monospace; }
      .footer { fill: #245f73; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="60" y="62">How one run goes</text>
  <text class="subtitle" x="60" y="98">Stages from preflight to cleanup</text>
  <rect class="task" x="60" y="128" width="276" height="56" rx="12"/>
  <text class="label" x="198" y="164">Preparation</text>
  <rect class="project" x="60" y="204" width="276" height="66" rx="12"/>
  <text class="label-l" x="76" y="244.0">0</text>
  <text class="small-l" x="140" y="243.0">preflight</text>
  <rect class="project" x="60" y="282" width="276" height="66" rx="12"/>
  <text class="label-l" x="76" y="322.0">1</text>
  <text class="small-l" x="140" y="321.0">framing</text>
  <rect class="task" x="60" y="360" width="276" height="66" rx="12"/>
  <text class="label-l" x="76" y="400.0">1b</text>
  <text class="small-l" x="140" y="389.0">reproduce the bug</text>
  <text class="small-l" x="140" y="411.0">before the fix</text>
  <rect class="task" x="360" y="128" width="276" height="56" rx="12"/>
  <text class="label" x="498" y="164">Plan</text>
  <line class="line" x1="336" y1="156" x2="356" y2="156"/>
  <rect class="project" x="360" y="204" width="276" height="66" rx="12"/>
  <text class="label-l" x="376" y="244.0">2</text>
  <text class="small-l" x="440" y="243.0">plan</text>
  <rect class="task" x="360" y="282" width="276" height="66" rx="12"/>
  <text class="label-l" x="376" y="322.0">2b</text>
  <text class="small-l" x="440" y="311.0">blind option</text>
  <text class="small-l" x="440" y="333.0">comparison</text>
  <rect class="task" x="360" y="360" width="276" height="66" rx="12"/>
  <text class="label-l" x="376" y="400.0">2c</text>
  <text class="small-l" x="440" y="399.0">UX agreement</text>
  <rect class="project" x="360" y="438" width="276" height="66" rx="12"/>
  <text class="label-l" x="376" y="478.0">3</text>
  <text class="small-l" x="440" y="477.0">plan review</text>
  <rect class="task" x="360" y="516" width="276" height="66" rx="12"/>
  <text class="label-l" x="376" y="556.0">3b</text>
  <text class="small-l" x="440" y="555.0">change-scope claim</text>
  <rect class="task" x="360" y="594" width="276" height="66" rx="12"/>
  <text class="label-l" x="376" y="634.0">3c</text>
  <text class="small-l" x="440" y="633.0">criteria → task</text>
  <rect class="task" x="660" y="128" width="276" height="56" rx="12"/>
  <text class="label" x="798" y="164">Implementation</text>
  <line class="line" x1="636" y1="156" x2="656" y2="156"/>
  <rect class="project" x="660" y="204" width="276" height="66" rx="12"/>
  <text class="label-l" x="676" y="244.0">4</text>
  <text class="small-l" x="740" y="243.0">implementation</text>
  <rect class="project" x="660" y="282" width="276" height="66" rx="12"/>
  <text class="label-l" x="676" y="322.0">5</text>
  <text class="small-l" x="740" y="321.0">tests</text>
  <rect class="task" x="660" y="360" width="276" height="66" rx="12"/>
  <text class="label-l" x="676" y="400.0">5.5</text>
  <text class="small-l" x="740" y="399.0">plan alignment</text>
  <rect class="project" x="660" y="438" width="276" height="66" rx="12"/>
  <text class="label-l" x="676" y="478.0">6</text>
  <text class="small-l" x="740" y="477.0">PR, CI, merge</text>
  <rect class="project" x="660" y="516" width="276" height="66" rx="12"/>
  <text class="label-l" x="676" y="556.0">7</text>
  <text class="small-l" x="740" y="555.0">deploy to staging</text>
  <rect class="task" x="960" y="128" width="276" height="56" rx="12"/>
  <text class="label" x="1098" y="164">Verification</text>
  <line class="line" x1="936" y1="156" x2="956" y2="156"/>
  <rect class="project" x="960" y="204" width="276" height="66" rx="12"/>
  <text class="label-l" x="976" y="244.0">8</text>
  <text class="small-l" x="1040" y="243.0">QA until approval</text>
  <rect class="task" x="960" y="282" width="276" height="66" rx="12"/>
  <text class="label-l" x="976" y="322.0">8.5</text>
  <text class="small-l" x="1040" y="321.0">QA audit</text>
  <rect class="task" x="960" y="360" width="276" height="66" rx="12"/>
  <text class="label-l" x="976" y="400.0">8.6</text>
  <text class="small-l" x="1040" y="399.0">UX review</text>
  <rect class="project" x="960" y="438" width="276" height="66" rx="12"/>
  <text class="label-l" x="976" y="478.0">9</text>
  <text class="small-l" x="1040" y="477.0">confirmation</text>
  <rect class="core" x="960" y="516" width="276" height="66" rx="12"/>
  <text class="label-l" x="976" y="556.0">10</text>
  <text class="small-l" x="1040" y="555.0">final check</text>
  <rect class="task" x="1260" y="128" width="276" height="56" rx="12"/>
  <text class="label" x="1398" y="164">Wrap-up</text>
  <line class="line" x1="1236" y1="156" x2="1256" y2="156"/>
  <rect class="project" x="1260" y="204" width="276" height="66" rx="12"/>
  <text class="label-l" x="1276" y="244.0">11</text>
  <text class="small-l" x="1340" y="243.0">retrospective</text>
  <rect class="project" x="1260" y="282" width="276" height="66" rx="12"/>
  <text class="label-l" x="1276" y="322.0">12–13</text>
  <text class="small-l" x="1340" y="321.0">cleanup</text>
  <rect class="dark" x="60" y="740" width="1476" height="110" rx="16"/>
  <text class="on-dark" x="90" y="782">Every stage leaves evidence</text>
  <text class="on-dark-2" x="90" y="820">So a run recovers after a process failure, and each stage shows what was done.</text>
</svg>
