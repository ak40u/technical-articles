<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One engineering team: roles and the message queue</title>
  <desc id="desc">The orchestrator tech lead and the QA agent exchange messages through a queue. The plan reviewer gets the plan and returns findings. The UX reviewer checks screenshots, the QA auditor checks the QA verdict. A final check that needs every verdict closes the run.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a776f"/>
    </marker>
    <marker id="arrow-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f4f2f"/>
    </marker>
    <style>
      .bg { fill: #fcfbf7; }
      .owner { fill: #f7eadc; stroke: #8f4f2f; stroke-width: 3; }
      .core { fill: #e8f2f4; stroke: #245f73; stroke-width: 3; }
      .project { fill: #edf6ef; stroke: #4f7b5d; stroke-width: 2.5; }
      .task { fill: #f3f0e8; stroke: #8b867d; stroke-width: 2; }
      .warn { fill: #fae9e5; stroke: #a34a3f; stroke-width: 2; }
      .dark { fill: #2b2a27; }
      .line { fill: none; stroke: #7a776f; stroke-width: 2.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #7a776f; stroke-width: 2.5; }
      .ownerline { fill: none; stroke: #8f4f2f; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-owner); }
      .rule { stroke: #ded9cd; stroke-width: 1.5; }
      .title { fill: #1d1d1b; font: 800 38px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #6c6860; font: 400 21px Arial, Helvetica, sans-serif; }
      .label { fill: #1d1d1b; font: 700 21px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .label-l { fill: #1d1d1b; font: 700 19px Arial, Helvetica, sans-serif; }
      .small { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small-l { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; }
      .edge { fill: #5f5b54; font: 700 16px Arial, Helvetica, sans-serif; }
      .edge-owner { fill: #8f4f2f; font: 700 16px Arial, Helvetica, sans-serif; }
      .band { fill: #1d1d1b; font: 400 18px Arial, Helvetica, sans-serif; }
      .band-b { fill: #1d1d1b; font: 700 18px Arial, Helvetica, sans-serif; }
      .on-dark { fill: #fcfbf7; font: 700 21px Arial, Helvetica, sans-serif; }
      .on-dark-2 { fill: #d9d4c7; font: 400 18px Arial, Helvetica, sans-serif; }
      .mono { fill: #1d1d1b; font: 400 15px Menlo, Consolas, monospace; }
      .footer { fill: #245f73; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="60" y="62">One team: roles and the message queue</text>
  <text class="subtitle" x="60" y="98">Roles pass each other evidence; the drafts of their reasoning stay with the author</text>
  <rect class="project" x="620" y="140" width="360" height="110" rx="14"/>
  <text class="label" x="800.0" y="180">Plan reviewer</text>
  <text class="small" x="800.0" y="210">checks the plan before code</text>
  <rect class="core" x="80" y="330" width="380" height="150" rx="14"/>
  <text class="label" x="270.0" y="370">Orchestrator tech lead</text>
  <text class="small" x="270.0" y="400">plan, code, PR,</text>
  <text class="small" x="270.0" y="426">the execution loop</text>
  <rect class="task" x="560" y="360" width="480" height="90" rx="14"/>
  <text class="label" x="800" y="398">Message queue</text>
  <text class="small" x="800" y="428">evidence travels between roles</text>
  <rect class="project" x="1140" y="330" width="380" height="150" rx="14"/>
  <text class="label" x="1330.0" y="370">QA agent</text>
  <text class="small" x="1330.0" y="400">walks the user path</text>
  <text class="small" x="1330.0" y="426">on staging</text>
  <line class="line" x1="460" y1="392" x2="556" y2="392"/>
  <line class="line" x1="560" y1="422" x2="464" y2="422"/>
  <line class="line" x1="1040" y1="392" x2="1136" y2="392"/>
  <line class="line" x1="1140" y1="422" x2="1044" y2="422"/>
  <path class="line" d="M 200 330 V 195 H 616"/>
  <text class="edge" x="360" y="183">plan</text>
  <line class="line" x1="800" y1="250" x2="800" y2="356"/>
  <text class="edge" x="814" y="310">findings</text>
  <line class="line" x1="270" y1="480" x2="270" y2="576"/>
  <text class="edge" x="284" y="534">screenshots</text>
  <line class="line" x1="1330" y1="480" x2="1330" y2="576"/>
  <text class="edge" x="1344" y="534">QA verdict</text>
  <rect class="project" x="80" y="580" width="380" height="110" rx="14"/>
  <text class="label" x="270.0" y="620">UX reviewer</text>
  <text class="small" x="270.0" y="650">compares screenshots with the UX agreement</text>
  <rect class="project" x="1140" y="580" width="380" height="110" rx="14"/>
  <text class="label" x="1330.0" y="620">QA auditor</text>
  <text class="small" x="1330.0" y="650">checks QA's evidence</text>
  <line class="line" x1="270" y1="690" x2="270" y2="746"/>
  <line class="line" x1="1330" y1="690" x2="1330" y2="746"/>
  <rect class="dark" x="80" y="750" width="1440" height="110" rx="16"/>
  <text class="on-dark" x="110" y="792">A service final check closes the run</text>
  <text class="on-dark-2" x="110" y="830">It closes a run only with positive QA and QA-audit verdicts, plus a UX verdict for UI tasks. It cannot be persuaded.</text>
</svg>
