<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Where a team's question goes</title>
  <desc id="desc">A tech lead's question goes to one of three columns. The team decides an extra review round, a busy stand, a UI dispute and a disputed amount. The lead decides disputes between teams, long runs, looping reviews and the queue. I am asked about production, product, client numbers and new spend. A night question waits for the morning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a776f"/>
    </marker>
    <marker id="arrow-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f4f2f"/>
    </marker>
    <style>
      .bg { fill: #fcfbf7; }
      .owner { fill: #f7eadc; stroke: #8f4f2f; stroke-width: 3; }
      .core { fill: #e8f2f4; stroke: #245f73; stroke-width: 3; }
      .project { fill: #edf6ef; stroke: #4f7b5d; stroke-width: 2.5; }
      .task { fill: #f3f0e8; stroke: #8b867d; stroke-width: 2; }
      .warn { fill: #fae9e5; stroke: #a34a3f; stroke-width: 2; }
      .dark { fill: #2b2a27; }
      .line { fill: none; stroke: #7a776f; stroke-width: 2.5; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #7a776f; stroke-width: 2.5; }
      .ownerline { fill: none; stroke: #8f4f2f; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-owner); }
      .rule { stroke: #ded9cd; stroke-width: 1.5; }
      .title { fill: #1d1d1b; font: 800 38px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #6c6860; font: 400 21px Arial, Helvetica, sans-serif; }
      .label { fill: #1d1d1b; font: 700 21px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .label-l { fill: #1d1d1b; font: 700 19px Arial, Helvetica, sans-serif; }
      .small { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .small-l { fill: #5f5b54; font: 400 16px Arial, Helvetica, sans-serif; }
      .edge { fill: #5f5b54; font: 700 16px Arial, Helvetica, sans-serif; }
      .edge-owner { fill: #8f4f2f; font: 700 16px Arial, Helvetica, sans-serif; }
      .band { fill: #1d1d1b; font: 400 18px Arial, Helvetica, sans-serif; }
      .band-b { fill: #1d1d1b; font: 700 18px Arial, Helvetica, sans-serif; }
      .on-dark { fill: #fcfbf7; font: 700 21px Arial, Helvetica, sans-serif; }
      .on-dark-2 { fill: #d9d4c7; font: 400 18px Arial, Helvetica, sans-serif; }
      .mono { fill: #1d1d1b; font: 400 15px Menlo, Consolas, monospace; }
      .footer { fill: #245f73; font: 700 20px Arial, Helvetica, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="60" y="62">Where a team's question goes</text>
  <text class="subtitle" x="60" y="98">The rules come from my past answers</text>
  <rect class="task" x="560" y="130" width="480" height="90" rx="14"/>
  <text class="label" x="800.0" y="166">The AI tech lead has a question</text>
  <text class="small" x="800.0" y="196">team roles never write outside</text>
  <line class="plain" x1="800" y1="220" x2="800" y2="245"/>
  <line class="plain" x1="290" y1="245" x2="1310" y2="245"/>
  <line class="line" x1="290" y1="245" x2="290" y2="276"/>
  <line class="line" x1="800" y1="245" x2="800" y2="276"/>
  <line class="line" x1="1310" y1="245" x2="1310" y2="276"/>
  <rect class="project" x="60" y="280" width="460" height="440" rx="16"/>
  <text class="label" x="290" y="322">The team decides</text>
  <text class="small" x="290" y="350">and logs the decision</text>
  <line class="rule" x1="84" y1="372" x2="496" y2="372"/>
  <text class="label-l" x="88" y="412">One more review round</text>
  <text class="small-l" x="88" y="440">I approved 21 times out of 21</text>
  <text class="label-l" x="88" y="492">The stand is busy</text>
  <text class="small-l" x="88" y="520">“wait”: my answer in 6 cases of 7</text>
  <text class="label-l" x="88" y="572">A UI dispute</text>
  <text class="small-l" x="88" y="600">the UX reviewer decides</text>
  <text class="label-l" x="88" y="652">A disputed amount</text>
  <text class="small-l" x="88" y="680">flag it, do not change it</text>
  <rect class="core" x="570" y="280" width="460" height="440" rx="16"/>
  <text class="label" x="800" y="322">The lead decides</text>
  <text class="small" x="800" y="350">the way I would</text>
  <line class="rule" x1="594" y1="372" x2="1006" y2="372"/>
  <text class="label-l" x="598" y="412">Whose stand or PR</text>
  <text class="small-l" x="598" y="440">a dispute between teams</text>
  <text class="label-l" x="598" y="492">A run over two hours</text>
  <text class="small-l" x="598" y="520">machine time only</text>
  <text class="label-l" x="598" y="572">A looping review</text>
  <text class="small-l" x="598" y="600">one more round or close the rest</text>
  <text class="label-l" x="598" y="652">The queue</text>
  <text class="small-l" x="598" y="680">order and restarting the fallen</text>
  <rect class="owner" x="1080" y="280" width="460" height="440" rx="16"/>
  <text class="label" x="1310" y="322">They ask me</text>
  <text class="small" x="1310" y="350">in Telegram, with answer buttons</text>
  <line class="rule" x1="1104" y1="372" x2="1516" y2="372"/>
  <text class="label-l" x="1108" y="412">Production and clients</text>
  <text class="small-l" x="1108" y="440">rollouts, client emails</text>
  <text class="label-l" x="1108" y="492">Product and legal</text>
  <text class="small-l" x="1108" y="520">8 of my 10 edits made the product fuller</text>
  <text class="label-l" x="1108" y="572">A number the client saw</text>
  <text class="small-l" x="1108" y="600">already delivered to them</text>
  <text class="label-l" x="1108" y="652">New spend</text>
  <text class="small-l" x="1108" y="680">and my “ask me before”</text>
  <rect class="dark" x="60" y="750" width="1480" height="110" rx="16"/>
  <text class="on-dark" x="90" y="792">I barely answer at night</text>
  <text class="on-dark-2" x="90" y="830">From 01:00 to 06:00, two answers in 50 days; between 08:00 and 09:00, 24. A night question waits for 08:30 while the team works on other tasks.</text>
</svg>
