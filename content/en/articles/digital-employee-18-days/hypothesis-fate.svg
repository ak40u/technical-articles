<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The fate of eleven hypotheses over 18 days</title>
  <desc id="desc">Eleven hypotheses opened in eighteen days, split across four outcomes: seven closed outright with a recorded cause, one with its main branch killed while the remainder waits for data, two under forward testing on paper with verdict dates already set, and one queued behind higher-priority work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d887e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fcfbf7"/>

  <text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" letter-spacing="2.6" fill="#245f73">HYPOTHESIS PIPELINE · 18 DAYS</text>
  <text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6c6860">The normal output of this pipeline is a dead idea with a recorded cause</text>

  <rect x="60" y="352" width="300" height="196" rx="14" fill="#ffffff" stroke="#245f73" stroke-width="2.5"/>
  <text x="210" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" fill="#1d1d1b">11</text>
  <text x="210" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="1.4" fill="#1d1d1b">HYPOTHESES</text>
  <text x="210" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6c6860">opened in 18 days</text>

  <path d="M 360 450 L 420 450" stroke="#8d887e" stroke-width="2" fill="none"/>
  <path d="M 420 235 L 420 665" stroke="#8d887e" stroke-width="2" fill="none"/>
  <path d="M 420 235 L 500 235" stroke="#8d887e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 378 L 500 378" stroke="#8d887e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 521 L 500 521" stroke="#8d887e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 664 L 500 664" stroke="#8d887e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="510" y="170" width="1030" height="130" rx="14" fill="#f3f0e8" stroke="#ded9cd" stroke-width="2"/>
  <text x="580" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#1d1d1b">7</text>
  <text x="670" y="219" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="1.2" fill="#1d1d1b">CLOSED OUTRIGHT</text>
  <text x="670" y="256" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6c6860">Cause of death on record. Revival only with a new structural fact</text>

  <rect x="510" y="313" width="1030" height="130" rx="14" fill="#f3f0e8" stroke="#ded9cd" stroke-width="2"/>
  <text x="580" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#1d1d1b">1</text>
  <text x="670" y="362" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="1.2" fill="#1d1d1b">MAIN BRANCH KILLED</text>
  <text x="670" y="399" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6c6860">The remainder waits for volume: too few observations, revisited in autumn</text>

  <rect x="510" y="456" width="1030" height="130" rx="14" fill="#e8f2f4" stroke="#245f73" stroke-width="2.5"/>
  <text x="580" y="538" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#245f73">2</text>
  <text x="670" y="505" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="1.2" fill="#1d1d1b">UNDER FORWARD TEST</text>
  <text x="670" y="542" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4a5f66">Verdict dates fixed in advance: August 8 and 15. No money in either</text>

  <rect x="510" y="599" width="1030" height="130" rx="14" fill="#f3f0e8" stroke="#ded9cd" stroke-width="2"/>
  <text x="580" y="681" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#1d1d1b">1</text>
  <text x="670" y="648" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="1.2" fill="#1d1d1b">QUEUED</text>
  <text x="670" y="685" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6c6860">The pipeline is busy above: ops and active hypotheses take priority</text>

  <line x1="60" y1="790" x2="1540" y2="790" stroke="#ded9cd" stroke-width="2"/>
  <text x="60" y="838" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="1.2" fill="#245f73">9 OF 11 TOURNAMENT REFUTATIONS CAME FROM LIVE MEASUREMENT</text>
  <text x="60" y="872" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6c6860">The judges opened order books and trade feeds instead of debating plausibility</text>
</svg>
