<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360">
    <!-- Background -->
    <rect width="1120" height="360" fill="#f8fafc" rx="8"/>
    
    <!-- Definitions -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,1 L9,5 L0,9" fill="none" stroke="#64748b" stroke-width="2"/>
        </marker>
        <style>
            .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 6px; }
            .agent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2px; rx: 6px; }
            .artifact { fill: #f0fdf4; stroke: #86efac; stroke-width: 2px; rx: 6px; }
            .gate { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2px; rx: 6px; }
            
            .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 13px; fill: #0f172a; text-anchor: middle; }
            .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
            .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #334155; text-anchor: middle; }
        </style>
    </defs>

    <!-- Phase 0: Producer -->
    <text class="label" x="145" y="90">Stage 0: Finding Value</text>
    <rect class="agent" x="40" y="115" width="210" height="65"/>
    <text class="text-title" x="145" y="140">Producer Agent</text>
    <text class="text-sub" x="145" y="160">Scans backlog &amp; error alerts</text>

    <!-- Value Task -->
    <rect class="artifact" x="40" y="215" width="210" height="50"/>
    <text class="text-title" x="145" y="238">Top-5 Tasks</text>
    <text class="text-sub" x="145" y="254">CPO filter &amp; prioritization</text>

    <line x1="145" y1="180" x2="145" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 250 240 C 285 240, 285 147, 310 147" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 1: Orchestrator / Scout -->
    <text class="label" x="425" y="90">Stage 1: Reconnaissance</text>
    <rect class="agent" x="320" y="115" width="210" height="65"/>
    <text class="text-title" x="425" y="140">Orchestrator Scout</text>
    <text class="text-sub" x="425" y="160">Worktree isolation + slicing</text>

    <!-- Artifact: Scout Log & AC -->
    <rect class="artifact" x="320" y="215" width="210" height="50"/>
    <text class="text-title" x="425" y="236">&lt;slug&gt;-slices.md</text>
    <text class="text-sub" x="425" y="254">acceptance-criteria.md</text>

    <line x1="425" y1="180" x2="425" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 530 240 C 565 240, 565 147, 590 147" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 2: Codex Review -->
    <text class="label" x="705" y="90">Stage 2: Validation</text>
    <rect class="gate" x="600" y="115" width="210" height="65"/>
    <text class="text-title" x="705" y="140">Adversarial Review</text>
    <text class="text-sub" x="705" y="160">Codex attacks plan to 0 issues</text>

    <line x1="810" y1="147" x2="870" y2="147" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 3: Code & Tests -->
    <text class="label" x="985" y="90">Stages 3-4: Build &amp; QA</text>
    <rect class="agent" x="880" y="115" width="200" height="65"/>
    <text class="text-title" x="980" y="140">Code Generation</text>
    <text class="text-sub" x="980" y="160">BDD + Stryker before code</text>

    <line x1="980" y1="180" x2="980" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Phase 4: QA -->
    <rect class="gate" x="880" y="215" width="200" height="65"/>
    <text class="text-title" x="980" y="240">Marina QA Loop</text>
    <text class="text-sub" x="980" y="260">Up to 5 fix-retest rounds</text>
    
    <path d="M 1080 247 C 1115 247, 1115 147, 1090 147" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>

</svg>
